<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Day 13</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #5cb1a6, #6dc1b5);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 860px;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
    }
    .section-title {
      font-size: 20px;
      margin-top: 30px;
      margin-bottom: 12px;
      color: #34495e;
      border-bottom: 2px solid #4caf91;
      padding-bottom: 4px;
    }
    .question {
      margin-bottom: 25px;
    }
    .english {
      font-size: 16px;
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .translation {
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 140px;
      padding: 6px;
      margin: 0 3px;
      font-size: 15px;
      border: 2px solid #ccc;
      border-radius: 6px;
    }
    .check-btn {
      margin-top: 6px;
      background: #4caf91;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .feedback {
      margin-top: 6px;
      font-weight: bold;
    }
    .correct { color: green; }
    .incorrect { color: red; }
    .example {
      font-style: italic;
      margin-top: 4px;
      color: #333;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      input[type="text"] {
        width: 100%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Task 2 - Day 13</h2>

    <div class="section-title">一. 句子填空（Environmental Protection）</div>

    <div id="q1" class="question"></div>
    <div id="q2" class="question"></div>
    <div id="q3" class="question"></div>
    <div id="q4" class="question"></div>
    <div id="q5" class="question"></div>

    <div class="section-title">二. 短语填空（含例句 + 翻译）</div>

    <div class="question">
      <div class="english">1. 交通成本：</div>
      <input type="text" id="p1">
      <button class="check-btn" onclick="checkPhrase('p1', 'transport cost', 'Rising fuel prices have significantly increased the transport cost for commuters.', '油价上涨显著增加了通勤者的交通成本。')">Check</button>
      <div class="feedback" id="fb_p1"></div>
    </div>

    <div class="question">
      <div class="english">2. 人口扩张：</div>
      <input type="text" id="p2">
      <button class="check-btn" onclick="checkPhrase('p2', 'population expansion', 'Rapid population expansion can put enormous pressure on urban infrastructure.', '快速的人口扩张会对城市基础设施造成巨大压力。')">Check</button>
      <div class="feedback" id="fb_p2"></div>
    </div>

    <div class="question">
      <div class="english">3. 步行可达：</div>
      <input type="text" id="p3">
      <button class="check-btn" onclick="checkPhrase('p3', 'within walking distance', 'The school is within walking distance of my house.', '学校离我家步行可达。')">Check</button>
      <div class="feedback" id="fb_p3"></div>
    </div>

    <div class="question">
      <div class="english">4. 驾驶执照：</div>
      <input type="text" id="p4">
      <button class="check-btn" onclick="checkPhrase('p4', 'driving license', 'You must have a valid driving license to rent a car.', '租车必须持有有效的驾驶执照。')">Check</button>
      <div class="feedback" id="fb_p4"></div>
    </div>

    <div class="question">
      <div class="english">5. 驾照考试：</div>
      <input type="text" id="p5">
      <button class="check-btn" onclick="checkPhrase('p5', 'driving test', 'He failed his driving test three times before passing.', '他考了三次驾照才通过。')">Check</button>
      <div class="feedback" id="fb_p5"></div>
    </div>
  </div>

  <script>
    const sentences = [
      {
        id: "s1",
        text: "Green spaces are not just decorative; they work as cooling infrastructure in crowded cities. In summer, asphalt roads and concrete buildings absorb heat, making some streets feel like ovens. This can be dangerous for elderly people, children, delivery workers, and construction workers who spend time outdoors. Trees, parks, and shaded sidewalks can lower surface temperatures and reduce heat-related health risks. Therefore, urban greenery improves public health, not just the appearance of a city.",
        translation: "城市绿地不只是装饰，它们在拥挤城市中起到降温基础设施的作用。夏天，柏油马路和水泥建筑会吸热，让一些街道像烤箱一样。这对老人、儿童、外卖员和建筑工人等经常在户外的人群很危险。树木、公园和有阴凉的人行道可以降低地表温度，减少高温相关健康风险。因此，城市绿化改善的是公共健康，而不仅仅是城市外观。",
        containerId: "q1"
      },
      {
        id: "s2",
        text: "Individual environmental actions may seem small, but they can send powerful social signals. For example, one student bringing a reusable cup will not solve climate change. However, if many students bring their own cups, avoid single-use utensils, and buy second-hand clothes, schools and businesses will notice the change in consumer demand. A school café may start offering discounts for reusable cups, or a shopping mall may organize second-hand exchange events. In this way, individual choices help make sustainable behavior socially normal.",
        translation: "个人环保行动看似很小，但它们可以发出强有力的社会信号。例如，一个学生自带杯子并不能解决气候变化。但如果很多学生都自带杯子、拒绝一次性餐具、购买二手衣服，学校和商家就会注意到消费者需求的变化。学校咖啡店可能开始给自带杯子的学生折扣，商场也可能组织二手交换活动。通过这种方式，个人选择可以让可持续行为变成社会常态。",
        containerId: "q2"
      },
      {
        id: "s3",
        text: "Corporate environmental responsibility should focus on supply chains, not just public slogans. For example, a clothing brand may advertise itself as eco-friendly, but its suppliers might still use polluting dyes, waste large amounts of water, or rely on excessive packaging. A more practical solution is to require companies to set measurable reduction targets and hold suppliers accountable for meeting environmental standards. This prevents greenwashing and reduces emissions across the entire production process.",
        translation: "企业环保责任应该关注供应链，而不是只停留在公开口号上。例如，一个服装品牌可能在广告中声称自己环保，但它的供应商仍然可能使用高污染染料、浪费大量水资源或依赖过度包装。更实际的解决办法是要求企业设定可衡量的减排目标，并让供应商承担达到环保标准的责任。这可以防止绿色洗白，并减少整个生产过程中的排放。",
        containerId: "q3"
      },
      {
        id: "s4",
        text: "Environmental education should move beyond recycling and teach pre-consumption thinking. Many students believe they are being environmentally responsible as long as they put plastic bottles into the recycling bin. However, the better question is whether the bottle needed to be purchased in the first place. For example, if a student buys bottled water every day, even recycling those bottles still creates packaging, transportation, and processing costs. Carrying a reusable water bottle reduces waste before it is created.",
        translation: "环保教育应该超越单纯回收，教会学生消费前思考。很多学生认为只要把塑料瓶丢进回收桶，就是环保。然而，更好的问题是：这个瓶子一开始是否有必要购买？例如，如果一个学生每天买瓶装水，即使这些瓶子都被回收了，仍然会产生包装、运输和处理成本。携带可重复使用的水瓶，则是在垃圾产生之前就减少浪费。",
        containerId: "q4"
      },
      {
        id: "s5",
        text: "Environmental protection should also include reducing food waste. In school cafeterias, students often take more food than they can finish, and large amounts of leftovers are thrown away every day. This waste has a hidden environmental cost because producing food requires water, land, transportation, and energy. Schools can respond in practical ways, such as offering half-portion options or donating unopened food to local food banks. These small changes make environmental action part of daily life.",
        translation: "环境保护也应该包括减少食物浪费。在学校食堂，学生经常拿超过自己能吃完的食物，每天都有大量剩饭被倒掉。这种浪费有隐藏的环境成本，因为生产食物需要水、土地、运输和能源。学校可以采取实际措施，比如提供半份选择，或者把未开封的食物捐给当地食物银行。这些小改变能让环保行动融入日常生活。",
        containerId: "q5"
      }
    ];

    function getRandomIndexes(array, min = 5, max = 7) {
      const count = Math.min(Math.floor(Math.random() * (max - min + 1)) + min, array.length);
      const set = new Set();
      while (set.size < count) {
        const i = Math.floor(Math.random() * array.length);
        const word = array[i].replace(/[.,()"]/g, '');
        if (word.length > 2 && !word.includes("'")) set.add(i);
      }
      return Array.from(set);
    }

    function renderSentence({ id, text, translation, containerId }) {
      const words = text.split(" ");
      const blanks = getRandomIndexes(words);
      const answers = {};
      const html = words.map((word, i) => {
        const clean = word.replace(/[.,()"]/g, "");
        const punct = word.match(/[.,()"]$/) ? word.slice(-1) : "";
        if (blanks.includes(i)) {
          const inputId = `${id}_${i}`;
          answers[inputId] = clean.toLowerCase();
          return `<input type="text" id="${inputId}" placeholder="...">${punct}`;
        }
        return word;
      }).join(" ");
      document.getElementById(containerId).innerHTML = `
        <div class="english">${html}</div>
        <div class="translation">${translation}</div>
        <button class="check-btn" onclick='checkSentence("${id}", ${JSON.stringify(answers)})'>Check</button>
        <div class="feedback" id="fb_${id}"></div>
      `;
    }

    function checkSentence(id, answers) {
      const feedback = document.getElementById("fb_" + id);
      let correct = true;
      for (const [inputId, expected] of Object.entries(answers)) {
        const val = document.getElementById(inputId).value.trim().toLowerCase();
        if (val !== expected) correct = false;
      }
      feedback.innerHTML = correct
        ? "<span class='correct'>✔ 正确！</span>"
        : `<span class='incorrect'>✘ 有错误</span> 正确答案：${Object.values(answers).join(" / ")}`;
    }

    function checkPhrase(id, answer, example, translation) {
      const feedback = document.getElementById("fb_" + id);
      const input = document.getElementById(id).value.trim().toLowerCase();
      const correctAnswer = answer.toLowerCase();
      if (input === correctAnswer) {
        feedback.innerHTML = `<span class="correct">✔ 正确！</span><div class="example">雅思例句：${example}</div><div class="example">中文翻译：${translation}</div>`;
      } else {
        feedback.innerHTML = `<span class="incorrect">✘ 错误</span> 正确答案：${answer}<div class="example">雅思例句：${example}</div><div class="example">中文翻译：${translation}</div>`;
      }
    }

    // 渲染所有句子填空
    sentences.forEach(renderSentence);
  </script>
</body>
</html>
